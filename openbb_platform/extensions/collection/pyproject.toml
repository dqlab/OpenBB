[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-collection"
version = "0.1.0"
description = "OpenBB routers for historical and live collection engines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openbb-core>=1.6.13,<2", "openbb-collector-core>=0.1.0,<0.2", "dq-historical-market-data-collector>=0.1.0,<0.2", "dq-live-market-data-collector>=0.1.0,<0.2"]

[project.entry-points."openbb_core_extension"]
collection = "openbb_collection.collection_router:router"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../collectors/core/src", "../../collectors/historical/src", "../../collectors/live/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
