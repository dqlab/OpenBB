[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbb-alpha"
version = "0.1.0"
description = "Bounded snapshot-based alpha contracts, labels and research boundaries."
requires-python = ">=3.11,<3.14"
dependencies = ["openbb-core>=1.6.13,<2", "pyarrow>=20,<26"]

[project.entry-points.openbb_core_extension]
alpha = "openbb_alpha.router:router"

[tool.hatch.build.targets.wheel]
packages = ["openbb_alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
