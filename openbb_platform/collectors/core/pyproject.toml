[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-collector-core"
version = "0.1.0"
description = "Shared contracts and provider dispatch for OpenBB collection engines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
ssh = ["paramiko>=3.4,<5"]
openbb = ["openbb-core>=1.6.13,<2"]
dev = ["tomlkit>=0.13", "packaging>=23", "pytest>=8", "ruff>=0.5", "build>=1", "openbb-core>=1.6.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
