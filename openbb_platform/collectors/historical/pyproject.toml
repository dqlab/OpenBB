[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-historical-market-data-collector"
version = "0.1.0"
description = "Independent historical market-data collection engine for OpenBB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openbb-collector-core>=0.1.0,<0.2", "pydantic>=2.7,<3", "PyYAML>=6,<7", "tzdata>=2024.1"]

[project.scripts]
dq-historical-market-data-collector = "dq_historical_market_data_collector.cli:main"

[project.optional-dependencies]
ssh = ["openbb-collector-core[ssh]>=0.1.0,<0.2"]
parquet = ["pyarrow>=15"]
duckdb = ["duckdb>=1"]
openbb = ["openbb-core>=1.6.13,<2"]
dev = ["pytest>=8", "ruff>=0.5", "build>=1", "openbb-core>=1.6.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dq_historical_market_data_collector = ["example.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src", "../core/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.entry-points."openbb_collector_extension"]
historical = "dq_historical_market_data_collector.extension:collector"
