# Configuration v2: provider/model dispatch with explicit parameter mappings.
version: 2
storage:
  root: ../../../data/live_market_data_derivatives
  format: jsonl
reset:
  period: monthly
  timezone: UTC
sources:
  ibkr:
    parameters:
      host: 127.0.0.1
      port: 4002
      client_id: 91
    timestamp_field: timestamp
    timestamp_semantics: provider_receive
    min_interval_seconds: 1
    retries: 1
    provider: ibkr
    model: MarketQuote
    parameter_map:
      symbol: symbol
      asset_type: asset_type
      currency: currency
      exchange: exchange
      primary_exchange: primary_exchange
      con_id: con_id
      feed_type: requested_feed_type
      snapshot_wait_seconds: snapshot_wait_seconds
    requested_feed_type: delayed
    feed_type_field: market_data_type
    feed_type_map:
      "1": live
      "2": frozen
      "3": delayed
      "4": delayed_frozen
    field_map:
      last_price: last
instruments:
  es_contract:
    symbol: ES
    asset_type: future
    currency: USD
    exchange: CME
    con_id: null
  spy_option_contract:
    symbol: SPY
    asset_type: option
    currency: USD
    exchange: SMART
    con_id: null
  es_option_contract:
    symbol: ES
    asset_type: future_option
    currency: USD
    exchange: CME
    con_id: null
collections:
  derivatives:
    instrument_ids:
    - es_contract
    - spy_option_contract
    - es_option_contract
    primary: ibkr
    secondary: []
    frequency_seconds: 30
    fields:
    - last_price
    - bid
    - ask
    - volume
    required_fields:
    - bid
    - ask
    accepted_feed_types:
    - live
    - delayed
    - delayed_frozen
    - unknown
    max_age_seconds: 60
    schedule:
      timezone: America/New_York
      weekdays:
      - 0
      - 1
      - 2
      - 3
      - 4
      start: 09:30
      end: '16:00'
      holidays: []
      overrides: {}
