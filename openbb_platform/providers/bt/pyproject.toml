[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbb-bt"
version = "0.1.0"
description = "Separately installable bt research workflow adapter."
requires-python = ">=3.11,<3.14"
dependencies = ["openbb-research==0.1.0", "bt>=1.3,<1.4"]

[tool.hatch.build.targets.wheel]
packages = ["openbb_bt"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
