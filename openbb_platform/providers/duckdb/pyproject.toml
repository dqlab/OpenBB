[tool.poetry]
name = "openbb-duckdb"
version = "1.0.0"
description = "DuckDB data provider extension for the OpenBB Platform"
authors = ["OpenBB Team <hello@openbb.co>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_duckdb" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
openbb-core = "^1.6.13"
duckdb = ">=1.0.0,<2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
duckdb = "openbb_duckdb:duckdb_provider"
