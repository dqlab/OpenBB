[tool.poetry]
name = "openbb-baostock"
version = "1.1.0"
description = "BaoStock data provider extension for the OpenBB Platform"
authors = ["OpenBB Team <hello@openbb.co>"]
readme = "README.md"
license = "AGPL-3.0-only"
packages = [{ include = "openbb_baostock" }]

[tool.poetry.dependencies]
python = ">=3.10,<4"
openbb-core = "^1.6.13"
baostock = ">=0.9.3,<0.10"
tzdata = ">=2024.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_provider_extension"]
baostock = "openbb_baostock:baostock_provider"

[tool.poetry.plugins."openbb_core_extension"]
baostock = "openbb_baostock.router:router"
