  "openbb_platform/extensions/econometrics/integration/test_econometrics_python.py::test_econometrics_panel_fmac",
  "openbb_platform/extensions/econometrics/integration/test_econometrics_python.py::test_econometrics_variance_inflation_factor",
]

# These packages have their real tests in extensions/alpha/tests.
# They must be importable; optional-dependency skips must not mask failed installs.
required_imports = [
  "qlib", "bt", "polars_ta", "alphalens", "pyarrow", "duckdb", "paramiko",
  "openbb_qlib", "openbb_bt", "openbb_research", "openbb_collection",
]

# PR6 is unmerged on develop. Both package trees must be present together; when
# present they are installed and tested, with the native SDK required.
[tick]
packages = ["openbb_platform/providers/futu", "openbb_platform/providers/ctp[native]"]
tests = ["openbb_platform/providers/futu/tests", "openbb_platform/providers/ctp/tests"]
required_imports = ["openbb_futu", "openbb_ctp", "openctp_ctp.thostmduserapi"]

[tick.provider_tests.futu]
models = ["EquityQuote"]
suites = ["openbb_platform/providers/futu/tests"]

[tick.provider_tests.ctp]
models = []
suites = ["openbb_platform/providers/ctp/tests"]

