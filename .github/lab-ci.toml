# These legacy integration-marked cases use local mocks/synthetic data. Execute
# exact selections after clean-asset checks and the real build, without live data.
offline_integration_tests = [
  "openbb_platform/tests/test_auto_build.py",
  "openbb_platform/extensions/econometrics/integration/test_econometrics_python.py::test_econometrics_panel_random_effects",
  "openbb_platform/extensions/econometrics/integration/test_econometrics_python.py::test_econometrics_panel_between",
