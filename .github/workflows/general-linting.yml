name: 🧹 General Linting

env:
  PIP_DEFAULT_TIMEOUT: 100

on:
  pull_request:
    types: [opened, synchronize, edited]
  # push:
  #   branches:
  #     - "feature/*"
  #     - "hotfix/*"
  #     - "release/*"
  merge_group:
    types: [checks_requested]

# Cancel previous runs that are not yet completed.
concurrency:
  group: ${{ github.event_name }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-linting:
    name: General Code Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout merge candidate with complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python 3.12.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            .github/requirements-lab-ci.txt
            .github/lab-ci.toml
            openbb_platform/**/pyproject.toml

      - name: Install checkout dependencies and explicit lint tools
        run: python .github/scripts/lab_ci.py install --reports lab-lint-results
      - name: Check repository spelling
        run: codespell --ignore-words=.codespell.ignore --skip="$(tr '\n' ',' < .codespell.skip | sed 's/,$//')" --quiet-level=2
      - name: Check changed Python files
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python .github/scripts/lint_ci.py --base "$LINT_BASE"
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-lint-results
          path: lab-lint-results/

  markdown-link-check:
    name: Markdown Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        name: Check out the code
      - name: Lint Code Base
        uses: docker://avtodev/markdown-lint:v1
        with:
          args: "./*.md ./changelogs/*.md ./openbb_terminal/**/*.md ./discordbot/**/*.md"

  json-yaml-validate:
    name: JSON Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: json-yaml-validate
        id: json-yaml-validate
        uses: GrantBirki/json-yaml-validate@9bbaa8474e3af4e91f25eda8ac194fdc30564d96 # v4
        with:
          yaml_exclude_regex: "construct.yaml"
          use_gitignore: false
